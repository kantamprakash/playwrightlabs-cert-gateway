# OpenTelemetry. Every request gets a W3C trace id, started at the gateway (or here, if called
# directly) and passed on to every service it reaches. It's in every log line as
# [traceId-spanId], and with OTEL_ENABLED=true the logs, traces and metrics are exported
# over OTLP (e.g. to the Grafana stack in playwrightlabs-cert-deploy).
management:
  metrics:
    distribution:
      # Latency histograms, so dashboards can show p50/p95/p99 per route and service.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.cloud.gateway.requests: true
        # Redis calls (the gateway's rate-limit counters).
        lettuce: true
  observations:
    enable:
      # Spring Security's internal steps (filter chain before/after, authorize) add a handful of spans to
      # every request without saying much; the HTTP spans already show timing per service.
      spring.security: false
  tracing:
    sampling:
      # Keep every trace: traffic is small, and a trace id from a user's report must be findable.
      probability: 1.0
  logging:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
  otlp:
    # Only the export is switched by OTEL_ENABLED. Tracing itself (ids in logs, traceparent between
    # services) always runs; management.tracing.export.enabled=false would switch propagation off too.
    tracing:
      export:
        enabled: ${OTEL_ENABLED:false}
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${DEPLOY_ENV:local}
      # Which copy sent the data (the pod or container name): without it, two replicas' metrics carry
      # identical labels and overwrite each other instead of adding up.
      service.instance.id: ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
